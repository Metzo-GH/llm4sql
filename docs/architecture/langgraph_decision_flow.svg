<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadowFlow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="10" width="880" height="38" rx="6" fill="#1e3a8a"/>
  <text x="460" y="34" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">CYCLE DE DÉCISION AGENTIQUE REACT &amp; BOUCLE DE SELF-HEALING (LANGGRAPH)</text>

  <!-- Node START -->
  <g transform="translate(30, 80)" filter="url(#shadowFlow)">
    <circle cx="35" cy="40" r="28" fill="#3b82f6"/>
    <text x="35" y="44" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">START</text>
  </g>

  <!-- Node Question Input -->
  <g transform="translate(120, 60)" filter="url(#shadowFlow)">
    <rect width="160" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="25" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">1. Requête Utilisateur</text>
    <text x="80" y="45" fill="#334155" font-size="10" text-anchor="middle">Langage Naturel</text>
    <text x="80" y="60" fill="#64748b" font-size="9" text-anchor="middle">+ Schéma actif ciblé</text>
  </g>

  <!-- Arrow Start -> Question -->
  <line x1="93" y1="100" x2="115" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Node Agent -->
  <g transform="translate(330, 60)" filter="url(#shadowFlow)">
    <rect width="180" height="80" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="10" y="8" width="160" height="20" rx="4" fill="#9333ea"/>
    <text x="90" y="22" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">NŒUD AGENT (LLM)</text>
    <text x="90" y="45" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">Raisonnement ReAct &lt;think&gt;</text>
    <text x="90" y="62" fill="#475569" font-size="9" text-anchor="middle">Génération Tool Call / SQL</text>
  </g>

  <!-- Arrow Question -> Agent -->
  <line x1="280" y1="100" x2="325" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Diamond Decision tools_condition -->
  <g transform="translate(560, 65)">
    <polygon points="45,0 90,35 45,70 0,35" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadowFlow)"/>
    <text x="45" y="32" fill="#92400e" font-size="10" font-weight="bold" text-anchor="middle">Action ?</text>
    <text x="45" y="46" fill="#b45309" font-size="8.5" text-anchor="middle">tools_condition</text>
  </g>

  <!-- Arrow Agent -> Decision -->
  <line x1="510" y1="100" x2="555" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Branch 1: MCP Tools (DOWN) -->
  <g transform="translate(330, 220)" filter="url(#shadowFlow)">
    <rect width="360" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="10" y="8" width="340" height="22" rx="4" fill="#c2410c"/>
    <text x="180" y="23" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">NŒUD OUTILS MCP (Execution Sandbox)</text>
    
    <rect x="15" y="38" width="160" height="30" rx="4" fill="#ffffff" stroke="#fdba74"/>
    <text x="22" y="52" fill="#9a3412" font-size="9.5" font-weight="bold">mcp_get_schema</text>
    <text x="22" y="63" fill="#64748b" font-size="8">Structure DDL &amp; Join Hints</text>

    <rect x="185" y="38" width="160" height="30" rx="4" fill="#ffffff" stroke="#fdba74"/>
    <text x="192" y="52" fill="#9a3412" font-size="9.5" font-weight="bold">mcp_search_value</text>
    <text x="192" y="63" fill="#64748b" font-size="8">Résolution ILIKE &amp; FKs</text>

    <rect x="15" y="73" width="330" height="30" rx="4" fill="#ffffff" stroke="#fdba74"/>
    <text x="22" y="87" fill="#9a3412" font-size="9.5" font-weight="bold">mcp_dry_run_query</text>
    <text x="22" y="98" fill="#64748b" font-size="8">Validation transaction isolée + Diagnostics d'erreurs PostgreSQL</text>
  </g>

  <!-- Arrow Decision -> MCP Tools -->
  <path d="M 605 135 L 605 215" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowHead)"/>
  <text x="612" y="175" fill="#c2410c" font-size="10" font-weight="bold">Tool Call requis</text>

  <!-- Loop Arrow MCP Tools -> Agent -->
  <path d="M 330 275 L 240 275 L 240 120 L 325 120" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowHead)"/>
  <text x="248" y="200" fill="#7e22ce" font-size="9.5" font-weight="bold">Résultat Outil MCP</text>

  <!-- Branch 2: Finalize & Validation (RIGHT) -->
  <g transform="translate(710, 60)" filter="url(#shadowFlow)">
    <rect width="180" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="10" y="8" width="160" height="20" rx="4" fill="#15803d"/>
    <text x="90" y="22" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">CLEAN &amp; FINALIZE</text>
    <text x="90" y="45" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">Extraction &amp; Filtrage AST</text>
    <text x="90" y="60" fill="#475569" font-size="9" text-anchor="middle">Vérification SELECT-only</text>
  </g>

  <!-- Arrow Decision -> Clean -->
  <line x1="650" y1="100" x2="705" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="655" y="92" fill="#15803d" font-size="9.5" font-weight="bold">Réponse finale</text>

  <!-- SELF HEALING LOOP EXPLANATION BOX -->
  <g transform="translate(30, 350)" filter="url(#shadowFlow)">
    <rect width="860" height="105" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="10" width="280" height="22" rx="4" fill="#b91c1c"/>
    <text x="25" y="25" fill="#ffffff" font-size="11" font-weight="bold">BOUCLE D'AUTO-CORRECTION (SELF-HEALING)</text>

    <text x="25" y="52" fill="#991b1b" font-size="11" font-weight="bold">1. Détection :</text>
    <text x="110" y="52" fill="#334155" font-size="10.5">mcp_dry_run_query intercepte une erreur PostgreSQL (ex: UndefinedColumn, AmbiguousFunction).</text>

    <text x="25" y="72" fill="#991b1b" font-size="11" font-weight="bold">2. Réinjection :</text>
    <text x="115" y="72" fill="#334155" font-size="10.5">Le message_primary et le message_hint natifs de PostgreSQL sont injectés dans l'historique LangGraph.</text>

    <text x="25" y="92" fill="#991b1b" font-size="11" font-weight="bold">3. Résolution :</text>
    <text x="115" y="92" fill="#334155" font-size="10.5">Le modèle reformule une requête corrigée. En cas de blocage persistant (3 itérations), fallback vers le dernier dry-run valide.</text>
  </g>
</svg>