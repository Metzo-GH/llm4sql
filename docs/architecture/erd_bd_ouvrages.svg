<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadowErd" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="20" y="10" width="880" height="38" rx="6" fill="#1e3a8a"/>
  <text x="460" y="34" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">MODÈLE ENTITÉ-ASSOCIATION (ERD) — BASE DE RÉFÉRENCE BD OUVRAGES</text>

  <!-- TABLE: PERSONNE -->
  <g transform="translate(40, 70)" filter="url(#shadowErd)">
    <rect width="220" height="150" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="220" height="28" rx="5" fill="#2563eb"/>
    <text x="110" y="19" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">personne</text>
    
    <text x="12" y="48" fill="#1e40af" font-size="10" font-weight="bold">PK  idp : INT</text>
    <line x1="10" y1="56" x2="210" y2="56" stroke="#e2e8f0"/>
    <text x="12" y="74" fill="#334155" font-size="10">nom : VARCHAR(100) [NOT NULL]</text>
    <text x="12" y="94" fill="#334155" font-size="10">prenom : VARCHAR(100) [NOT NULL]</text>
    <text x="12" y="114" fill="#64748b" font-size="10">date_naiss : DATE (nullable)</text>
    <text x="12" y="134" fill="#64748b" font-size="10">date_deces : DATE (nullable)</text>
  </g>

  <!-- TABLE: OUVRAGE (Centrale) -->
  <g transform="translate(340, 70)" filter="url(#shadowErd)">
    <rect width="260" height="230" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
    <rect width="260" height="30" rx="5" fill="#1e3a8a"/>
    <text x="130" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">ouvrage (Table Centrale)</text>
    
    <text x="12" y="52" fill="#1e3a8a" font-size="10.5" font-weight="bold">PK  ido : INT</text>
    <line x1="10" y1="60" x2="250" y2="60" stroke="#cbd5e1"/>
    <text x="12" y="78" fill="#334155" font-size="10">titre : VARCHAR(255) [NOT NULL]</text>
    <text x="12" y="98" fill="#7c3aed" font-size="10" font-weight="600">FK  dessinateur ➔ personne(idp)</text>
    <text x="12" y="118" fill="#7c3aed" font-size="10" font-weight="600">FK  scenariste ➔ personne(idp)</text>
    <text x="12" y="138" fill="#7c3aed" font-size="10" font-weight="600">FK  coloriste ➔ personne(idp)</text>
    <text x="12" y="158" fill="#b45309" font-size="10" font-weight="bold">FK  ids ➔ serie(ids) [NULLABLE]</text>
    <text x="12" y="178" fill="#64748b" font-size="10">num_ordre : INT</text>
    <text x="12" y="198" fill="#64748b" font-size="10">date_sortie : DATE</text>
    <rect x="8" y="208" width="244" height="16" rx="3" fill="#fef3c7"/>
    <text x="12" y="220" fill="#b45309" font-size="8.5" font-weight="bold">⭐ Join Hint MCP: LEFT JOIN si ids nullable</text>
  </g>

  <!-- TABLE: SERIE -->
  <g transform="translate(680, 70)" filter="url(#shadowErd)">
    <rect width="200" height="90" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="200" height="28" rx="5" fill="#d97706"/>
    <text x="100" y="19" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">serie</text>
    
    <text x="12" y="48" fill="#b45309" font-size="10" font-weight="bold">PK  ids : INT</text>
    <line x1="10" y1="56" x2="190" y2="56" stroke="#e2e8f0"/>
    <text x="12" y="74" fill="#334155" font-size="10">titre : VARCHAR(255) [NOT NULL]</text>
  </g>

  <!-- TABLE: AVIS -->
  <g transform="translate(40, 360)" filter="url(#shadowErd)">
    <rect width="220" height="120" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect width="220" height="28" rx="5" fill="#059669"/>
    <text x="110" y="19" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">avis</text>
    
    <text x="12" y="48" fill="#065f46" font-size="10" font-weight="bold">PK,FK  (pseudo, ido)</text>
    <line x1="10" y1="56" x2="210" y2="56" stroke="#e2e8f0"/>
    <text x="12" y="74" fill="#7c3aed" font-size="10">FK  ido ➔ ouvrage(ido)</text>
    <text x="12" y="94" fill="#334155" font-size="10">pseudo : VARCHAR(100)</text>
    <text x="12" y="112" fill="#334155" font-size="10">score : INT (CHECK 0..10)</text>
  </g>

  <!-- TABLE: A_POUR_MOT_CLE -->
  <g transform="translate(340, 360)" filter="url(#shadowErd)">
    <rect width="260" height="110" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="260" height="28" rx="5" fill="#7c3aed"/>
    <text x="130" y="19" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">a_pour_mot_cle (Liaison N:M)</text>
    
    <text x="12" y="48" fill="#5b21b6" font-size="10" font-weight="bold">PK  (ido, idc)</text>
    <line x1="10" y1="56" x2="250" y2="56" stroke="#e2e8f0"/>
    <text x="12" y="74" fill="#7c3aed" font-size="10">FK  ido ➔ ouvrage(ido)</text>
    <text x="12" y="94" fill="#7c3aed" font-size="10">FK  idc ➔ concept(idc)</text>
  </g>

  <!-- TABLE: CONCEPT -->
  <g transform="translate(680, 330)" filter="url(#shadowErd)">
    <rect width="200" height="150" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="200" height="28" rx="5" fill="#dc2626"/>
    <text x="100" y="19" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">concept (Hiérarchie)</text>
    
    <text x="12" y="48" fill="#991b1b" font-size="10" font-weight="bold">PK  idc : INT</text>
    <line x1="10" y1="56" x2="190" y2="56" stroke="#e2e8f0"/>
    <text x="12" y="74" fill="#334155" font-size="10">label : VARCHAR(100) [NOT NULL]</text>
    <text x="12" y="98" fill="#dc2626" font-size="10" font-weight="bold">FK  concept_pere ➔ idc</text>
    <text x="12" y="112" fill="#64748b" font-size="8.5">(Relation réflexive récursive)</text>
    <rect x="8" y="124" width="184" height="18" rx="3" fill="#fee2e2"/>
    <text x="12" y="137" fill="#991b1b" font-size="8.5" font-weight="bold">WITH RECURSIVE requis</text>
  </g>

  <!-- Relation Lines -->
  <!-- personne <-> ouvrage (3 FKs) -->
  <path d="M 260 120 L 340 120" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="112" fill="#7c3aed" font-size="9" font-weight="bold">1..n (x3)</text>

  <!-- serie <-> ouvrage (1 FK nullable) -->
  <path d="M 600 120 L 680 120" stroke="#d97706" stroke-width="2"/>
  <text x="615" y="112" fill="#d97706" font-size="9" font-weight="bold">0..1 / 0..n</text>

  <!-- ouvrage <-> avis -->
  <path d="M 400 300 L 400 330 L 150 330 L 150 360" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="160" y="348" fill="#059669" font-size="9" font-weight="bold">0..n</text>

  <!-- ouvrage <-> a_pour_mot_cle -->
  <path d="M 470 300 L 470 360" stroke="#7c3aed" stroke-width="2"/>
  <text x="475" y="335" fill="#7c3aed" font-size="9" font-weight="bold">0..n</text>

  <!-- a_pour_mot_cle <-> concept -->
  <path d="M 600 415 L 680 415" stroke="#7c3aed" stroke-width="2"/>
  <text x="615" y="405" fill="#7c3aed" font-size="9" font-weight="bold">0..n</text>

  <!-- concept reflexivity loop -->
  <path d="M 880 390 C 920 390 920 440 880 440" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="890" y="418" fill="#dc2626" font-size="9" font-weight="bold">0..1</text>
</svg>