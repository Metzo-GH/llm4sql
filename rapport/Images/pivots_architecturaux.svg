<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    
    <linearGradient id="badCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>

    <linearGradient id="goodCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Arrière-plan -->
  <rect width="950" height="560" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Titre -->
  <g transform="translate(475, 40)">
    <text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">
      Autopsie des Choix d'Ingénierie : Impasses Abandonnées vs Solutions Adoptées
    </text>
    <text text-anchor="middle" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">
      Trois décisions d'architecture majeures guidées par l'expérience empirique et documentées dans AI_MAP.md
    </text>
  </g>

  <!-- ==================== COLONNE 1 : ÉVALUATION SÉMANTIQUE (Phase R16) ==================== -->
  <g transform="translate(40, 90)">
    <!-- Entête 1 -->
    <rect width="265" height="32" rx="6" fill="#0284c7"/>
    <text x="132" y="21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
      1. Évaluation Sémantique SQL
    </text>

    <!-- Carte Abandonnée -->
    <g transform="translate(0, 45)">
      <rect width="265" height="180" rx="10" fill="url(#badCardGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="12" y="12" width="75" height="20" rx="4" fill="#e11d48"/>
      <text x="49" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ABANDONNÉ</text>
      
      <text x="12" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#9f1239">Traducteur AST ➔ Français</text>
      <text x="12" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">
        • Traduction mot à mot de l'AST
      </text>
      <text x="12" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">
        • Cosine similarity avec la question
      </text>
      
      <line x1="12" y1="98" x2="253" y2="98" stroke="#fecdd3" stroke-width="1"/>
      
      <text x="12" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#be123c">Cause de l'échec :</text>
      <text x="12" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        Faux négatifs massifs (0% à 30%).
      </text>
      <text x="12" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        Le SQL juste génère une phrase trop
      </text>
      <text x="12" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        éloignée du langage naturel.
      </text>
    </g>

    <!-- Flèche Pivot -->
    <path d="M 132 235 L 132 255" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>

    <!-- Carte Adoptée -->
    <g transform="translate(0, 265)">
      <rect width="265" height="175" rx="10" fill="url(#goodCardGrad)" stroke="#16a34a" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="12" y="12" width="60" height="20" rx="4" fill="#16a34a"/>
      <text x="42" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ADOPTÉ</text>
      
      <text x="12" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Execution Accuracy Réelle</text>
      <text x="12" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">
        • Exécution sur base PostgreSQL
      </text>
      <text x="12" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">
        • Soft-matching par jetons utiles
      </text>
      
      <line x1="12" y1="98" x2="253" y2="98" stroke="#bbf7d0" stroke-width="1"/>
      
      <text x="12" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#14532d">Bénéfice mesuré :</text>
      <text x="12" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        Vérité terrain absolue : 100% de
      </text>
      <text x="12" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        fiabilité, zéro faux négatif sur les
      </text>
      <text x="12" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        requêtes valides.
      </text>
    </g>
  </g>

  <!-- ==================== COLONNE 2 : GUIDAGE DU PROMPT (Phase R27) ==================== -->
  <g transform="translate(342, 90)">
    <!-- Entête 2 -->
    <rect width="265" height="32" rx="6" fill="#0284c7"/>
    <text x="132" y="21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
      2. Guidage Cognitif du LLM
    </text>

    <!-- Carte Abandonnée -->
    <g transform="translate(0, 45)">
      <rect width="265" height="180" rx="10" fill="url(#badCardGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="12" y="12" width="75" height="20" rx="4" fill="#e11d48"/>
      <text x="49" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ABANDONNÉ</text>
      
      <text x="12" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#9f1239">Dynamic Few-Shot RAG</text>
      <text x="12" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">
        • Catalogue de gabarits JSON
      </text>
      <text x="12" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">
        • Injection d'exemples sur-mesure
      </text>
      
      <line x1="12" y1="98" x2="253" y2="98" stroke="#fecdd3" stroke-width="1"/>
      
      <text x="12" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#be123c">Cause de l'échec :</text>
      <text x="12" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        Effondrement d'attention (4B).
      </text>
      <text x="12" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        Exemples approximatifs polluant
      </text>
      <text x="12" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        le contexte et générant des biais.
      </text>
    </g>

    <!-- Flèche Pivot -->
    <path d="M 132 235 L 132 255" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>

    <!-- Carte Adoptée -->
    <g transform="translate(0, 265)">
      <rect width="265" height="175" rx="10" fill="url(#goodCardGrad)" stroke="#16a34a" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="12" y="12" width="60" height="20" rx="4" fill="#16a34a"/>
      <text x="42" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ADOPTÉ</text>
      
      <text x="12" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Zero-Shot + Outils MCP</text>
      <text x="12" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">
        • Prompt épuré (directives pures)
      </text>
      <text x="12" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">
        • Introspection ciblée à la demande
      </text>
      
      <line x1="12" y1="98" x2="253" y2="98" stroke="#bbf7d0" stroke-width="1"/>
      
      <text x="12" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#14532d">Bénéfice mesuré :</text>
      <text x="12" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        Zéro hallucination de tables,
      </text>
      <text x="12" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        consommation tokens divisée par 3,
      </text>
      <text x="12" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        adaptation universelle au Sandbox.
      </text>
    </g>
  </g>

  <!-- ==================== COLONNE 3 : RENDU MERMAID (Phase 5) ==================== -->
  <g transform="translate(644, 90)">
    <!-- Entête 3 -->
    <rect width="265" height="32" rx="6" fill="#0284c7"/>
    <text x="132" y="21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
      3. Rendu de Schémas (UI)
    </text>

    <!-- Carte Abandonnée -->
    <g transform="translate(0, 45)">
      <rect width="265" height="180" rx="10" fill="url(#badCardGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="12" y="12" width="75" height="20" rx="4" fill="#e11d48"/>
      <text x="49" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ABANDONNÉ</text>
      
      <text x="12" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#9f1239">Génération Mermaid par LLM</text>
      <text x="12" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">
        • Invite LLM pour créer le diagramme
      </text>
      <text x="12" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">
        • Traduction du DDL en syntaxe ERD
      </text>
      
      <line x1="12" y1="98" x2="253" y2="98" stroke="#fecdd3" stroke-width="1"/>
      
      <text x="12" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#be123c">Cause de l'échec :</text>
      <text x="12" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        Latence élevée (4 à 8 secondes).
      </text>
      <text x="12" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        Erreurs de syntaxe Mermaid
      </text>
      <text x="12" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#881337">
        fréquentes cassant le rendu web.
      </text>
    </g>

    <!-- Flèche Pivot -->
    <path d="M 132 235 L 132 255" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>

    <!-- Carte Adoptée -->
    <g transform="translate(0, 265)">
      <rect width="265" height="175" rx="10" fill="url(#goodCardGrad)" stroke="#16a34a" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="12" y="12" width="60" height="20" rx="4" fill="#16a34a"/>
      <text x="42" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ADOPTÉ</text>
      
      <text x="12" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Parser DDL en Python Pur</text>
      <text x="12" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">
        • Analyse AST `sqlglot` native
      </text>
      <text x="12" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">
        • Génération Mermaid directe
      </text>
      
      <line x1="12" y1="98" x2="253" y2="98" stroke="#bbf7d0" stroke-width="1"/>
      
      <text x="12" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#14532d">Bénéfice mesuré :</text>
      <text x="12" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        Rendu instantané (&lt; 1 ms),
      </text>
      <text x="12" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        100% de fiabilité syntaxique,
      </text>
      <text x="12" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#14532d">
        aucune charge sur Ollama.
      </text>
    </g>
  </g>

  <!-- Bas de page explicatif -->
  <g transform="translate(475, 520)">
    <text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" font-style="italic">
      Principe d'architecture : Ne jamais déléguer au LLM ce qui peut être résolu de façon déterministe et instantanée par du code classique.
    </text>
  </g>
</svg>
