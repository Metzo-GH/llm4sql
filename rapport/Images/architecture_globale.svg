<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradLayer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gradLayer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="gradLayer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="gradLayer4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="860" height="42" rx="6" fill="url(#gradHeader)"/>
  <text x="450" y="41" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="0.5">TOPOLOGIE EN COUCHES &amp; FLUX DE DONNÉES DE LA PLATEFORME LLM4SQL</text>

  <!-- LAYER 1: FRONTEND -->
  <g transform="translate(30, 75)" filter="url(#shadow)">
    <rect width="840" height="95" rx="8" fill="url(#gradLayer1)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="12" width="220" height="26" rx="4" fill="#1d4ed8"/>
    <text x="25" y="29" fill="#ffffff" font-size="12" font-weight="bold">1. COUCHE PRÉSENTATION</text>
    <text x="250" y="30" fill="#1e40af" font-size="13" font-weight="600">Application Web SPA (React 19, TypeScript Strict, Vite, Tailwind CSS v4)</text>
    
    <!-- Sub-boxes -->
    <rect x="15" y="48" width="255" height="36" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="65" fill="#1e293b" font-size="11" font-weight="bold">Interface Chat &amp; XAI</text>
    <text x="25" y="78" fill="#64748b" font-size="10">Streaming SSE, Suivi &lt;think&gt;</text>

    <rect x="285" y="48" width="260" height="36" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="295" y="65" fill="#1e293b" font-size="11" font-weight="bold">Bac à Sable DDL (Sandbox)</text>
    <text x="295" y="78" fill="#64748b" font-size="10">Éditeur SQL, Parser AST &lt;1ms</text>

    <rect x="560" y="48" width="265" height="36" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="570" y="65" fill="#1e293b" font-size="11" font-weight="bold">Explorateur de Données &amp; Dataviz</text>
    <text x="570" y="78" fill="#64748b" font-size="10">DataTable Virtualisé, Recharts, Export CSV</text>
  </g>

  <!-- Down/Up Arrow 1 -->
  <g transform="translate(450, 175)">
    <line x1="0" y1="0" x2="0" y2="22" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="-4,22 4,22 0,28" fill="#64748b"/>
    <text x="12" y="16" fill="#475569" font-size="10" font-weight="600">Requêtes REST HTTP / Flux Événements SSE</text>
  </g>

  <!-- LAYER 2: BACKEND & SECURITY -->
  <g transform="translate(30, 210)" filter="url(#shadow)">
    <rect width="840" height="95" rx="8" fill="url(#gradLayer2)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="12" width="240" height="26" rx="4" fill="#047857"/>
    <text x="25" y="29" fill="#ffffff" font-size="12" font-weight="bold">2. COUCHE API &amp; SÉCURITÉ</text>
    <text x="270" y="30" fill="#065f46" font-size="13" font-weight="600">Serveur Web Asynchrone (FastAPI, Pydantic v2, Python 3.12)</text>

    <!-- Sub-boxes -->
    <rect x="15" y="48" width="255" height="36" rx="5" fill="#ffffff" stroke="#86efac"/>
    <text x="25" y="65" fill="#1e293b" font-size="11" font-weight="bold">Routeurs Modulaires APIRouter</text>
    <text x="25" y="78" fill="#64748b" font-size="10">/chat, /schema, /sandbox, /eval</text>

    <rect x="285" y="48" width="260" height="36" rx="5" fill="#ffffff" stroke="#86efac"/>
    <text x="295" y="65" fill="#1e293b" font-size="11" font-weight="bold">Filtrage Sécurité AST (SQLGlot)</text>
    <text x="295" y="78" fill="#64748b" font-size="10">Blocage déterministe non-SELECT</text>

    <rect x="560" y="48" width="265" height="36" rx="5" fill="#ffffff" stroke="#86efac"/>
    <text x="570" y="65" fill="#1e293b" font-size="11" font-weight="bold">Cache Sémantique Vectoriel</text>
    <text x="570" y="78" fill="#64748b" font-size="10">Cosinus (0ms) &amp; Isolation OWASP LLM08</text>
  </g>

  <!-- Down/Up Arrow 2 -->
  <g transform="translate(450, 310)">
    <line x1="0" y1="0" x2="0" y2="22" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="-4,22 4,22 0,28" fill="#64748b"/>
    <text x="12" y="16" fill="#475569" font-size="10" font-weight="600">Invocations d'États &amp; Appels d'Outils Standardisés</text>
  </g>

  <!-- LAYER 3: AGENTIC ENGINE & MCP -->
  <g transform="translate(30, 345)" filter="url(#shadow)">
    <rect width="840" height="105" rx="8" fill="url(#gradLayer3)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="15" y="12" width="270" height="26" rx="4" fill="#7e22ce"/>
    <text x="25" y="29" fill="#ffffff" font-size="12" font-weight="bold">3. COUCHE AGENTIQUE &amp; MCP</text>
    <text x="300" y="30" fill="#581c87" font-size="13" font-weight="600">Orchestration LangGraph &amp; Standard Model Context Protocol</text>

    <!-- Sub-boxes -->
    <rect x="15" y="48" width="390" height="46" rx="5" fill="#ffffff" stroke="#d8b4fe"/>
    <text x="25" y="65" fill="#1e293b" font-size="11" font-weight="bold">Graphe de Raisonnement ReAct (LangGraph)</text>
    <text x="25" y="80" fill="#64748b" font-size="10">• Nœud Agent &amp; Bind Tools  • Boucle Self-Healing (3 essais)</text>

    <rect x="420" y="48" width="405" height="46" rx="5" fill="#ffffff" stroke="#d8b4fe"/>
    <text x="430" y="65" fill="#1e293b" font-size="11" font-weight="bold">Serveur d'Outils MCP (Lecture Seule Déterministe)</text>
    <text x="430" y="80" fill="#64748b" font-size="10">• mcp_get_schema (Join Hints) • mcp_search_value • mcp_dry_run_query</text>
  </g>

  <!-- Down/Up Arrow 3 -->
  <g transform="translate(450, 455)">
    <line x1="0" y1="0" x2="0" y2="22" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="-4,22 4,22 0,28" fill="#64748b"/>
    <text x="12" y="16" fill="#475569" font-size="10" font-weight="600">Inférence LLM Locale (IPC/HTTP) &amp; Pool PostgreSQL (Read-Only)</text>
  </g>

  <!-- LAYER 4: INFRASTRUCTURE & PERSISTENCE -->
  <g transform="translate(30, 490)" filter="url(#shadow)">
    <rect width="840" height="95" rx="8" fill="url(#gradLayer4)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="15" y="12" width="295" height="26" rx="4" fill="#334155"/>
    <text x="25" y="29" fill="#ffffff" font-size="12" font-weight="bold">4. PERSISTANCE &amp; INFÉRENCE LOCALE</text>
    <text x="325" y="30" fill="#1e293b" font-size="13" font-weight="600">Infrastructure Conteneurisée (Docker Compose, 100% Hors-Ligne)</text>

    <!-- Sub-boxes -->
    <rect x="15" y="48" width="390" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="65" fill="#1e293b" font-size="11" font-weight="bold">Base de Données PostgreSQL 16</text>
    <text x="25" y="78" fill="#64748b" font-size="10">Conteneur Docker, Pool psycopg v3, Sessions readonly=True</text>

    <rect x="420" y="48" width="405" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="430" y="65" fill="#1e293b" font-size="11" font-weight="bold">Moteur d'Inférence LLM Local (Ollama)</text>
    <text x="430" y="78" fill="#64748b" font-size="10">Modèle Qwen 3.5 (4B / 9B quantifié 4-bit), Embeddings locaux</text>
  </g>
</svg>