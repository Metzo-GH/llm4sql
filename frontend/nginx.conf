server {
    listen 5173;
    server_name localhost;

    # Répertoire racine des fichiers statiques compilés
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour optimiser les performances
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Support du routage SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverse vers l'API FastAPI Backend pour les requêtes /api
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indispensable pour le streaming Server-Sent Events (SSE) en temps réel
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy pour la vérification racine
    location = / {
        try_files $uri /index.html;
    }
}
